name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on every supported runtime
    # Host runner: clojure, bb and clz all come from the runner daemon's PATH.
    runs-on: mac

    steps:
      - uses: actions/checkout@v4

      - name: Show runtime versions
        run: |
          clojure -Sdescribe | head -3
          bb --version
          clz --version

      - name: Suite on JVM Clojure, Babashka and clz
        run: ./script/test-all.sh
